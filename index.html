<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="search">
        <input type="text" id="search" placeholder="Enter City" spellcheck="false">
        <button id="searchBtn">🔍</button>
    </div>
    <div class="container">
            <div class="temp">
                <div class="tempNum">
                    <h1>22°C</h1>
                </div> 
                <div class="city">
                 <h2>Delhi</h2>
                </div> 
            </div>
            <div class="parent">
             <div class="details1">
                <div id="humidity">
                  <h2>50%</h2>
                </div>
             <h3>Humidity</h3>
            </div>
            <div class="details2">
                <div class="windSpeed">
                   <h2>15km/h</h2>
                </div>
                 <h3>Wind Speed</h3>
            </div>
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
